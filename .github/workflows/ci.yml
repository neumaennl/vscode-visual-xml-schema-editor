name: CI

permissions:
  checks: write
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main, modernization ]
  # All pull requests, whatever their target branch.
  pull_request:

# A new push to a pull request cancels the run for the previous one; runs for pushes are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Install, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Check that Node and @types match the VS Code version
        run: npm run vscode:check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The only build: `vscode:prepublish` deletes out/ and webview/ and compiles both
      # parts. The later steps use this build instead of compiling again.
      - name: Build and package VSIX
        run: npm run package

      - name: Verify packaged extension loads
        run: npm run package:verify

      - name: Type check
        run: npm run typecheck

      # Vitest runs on the sources and needs no build; `npm test` would compile first.
      - name: Run tests (coverage; JUnit via config)
        run: npx vitest run --coverage

      - name: Read the VS Code version for the extension-host tests
        id: vscode-version
        # The lowest supported version; `npm run vscode:check` ensures the form `^x.y.z`.
        run: echo "version=$(node -p "require('./package.json').engines.vscode.slice(1)")" >> "$GITHUB_OUTPUT"

      - name: Cache VS Code for the extension-host tests
        uses: actions/cache@v6
        with:
          path: .vscode-test/vscode-linux-x64-${{ steps.vscode-version.outputs.version }}
          key: vscode-linux-x64-${{ steps.vscode-version.outputs.version }}

      # Uses the extension from the package step; `npm run test:extension-host` would compile it again.
      - name: Run tests in the extension host
        run: |
          npm run stage:extension-host
          xvfb-run -a npx vscode-test

      - name: Summarize coverage in job summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('fs');
          const p = 'coverage/coverage-summary.json';
          const out = process.env.GITHUB_STEP_SUMMARY;
          if (!out) { console.log('GITHUB_STEP_SUMMARY not set; skipping summary'); process.exit(0); }
          if (fs.existsSync(p)) {
            const d = JSON.parse(fs.readFileSync(p));
            let summary = '## Coverage report\n\n| Metric | % |\n|---|---|\n';
            for (const k in d.total) {
              summary += `| ${k} | ${d.total[k].pct}% |\n`;
            }
            fs.appendFileSync(out, summary);
          }
          EOF
          
      - name: Check if JUnit report exists
        if: always()
        id: junit-check
        shell: bash
        run: |
          if [[ -f "test-results/vitest-junit.xml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish JUnit test report to GitHub Checks
        if: always() && steps.junit-check.outputs.exists == 'true'
        uses: dorny/test-reporter@v3
        with:
          name: Vitest
          path: test-results/vitest-junit.xml
          # Vitest writes JUnit XML in the format of jest-junit, which this parser reads.
          reporter: jest-junit

      - name: Publish extension-host test report to GitHub Checks
        if: always() && hashFiles('test-results/extension-host.json') != ''
        uses: dorny/test-reporter@v3
        with:
          name: Extension host
          path: test-results/extension-host.json
          # Written by Mocha's json reporter, which .vscode-test.mjs selects in GitHub Actions.
          reporter: mocha-json
